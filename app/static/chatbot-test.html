<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/static/favicon.ico" sizes="any" />
    <title>Box Catering Chatbot - Тестовий чат</title>
    <style>
        body {
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            background: white;
            border-radius: 15px;
            margin: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat-header h2 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .chat-header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            max-height: 500px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            flex-shrink: 0;
        }

        .message.user .message-avatar {
            background: #667eea;
            color: white;
        }

        .message.bot .message-avatar {
            background: #28a745;
            color: white;
        }

        .message-content {
            background: white;
            padding: 15px;
            border-radius: 18px;
            max-width: 70%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            position: relative;
        }

        /* .message-content > div:first-child {
                white-space: break-spaces;
            } */

        .message.user .message-content {
            background: #667eea;
            color: white;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
            text-align: right;
        }

        .message.user .message-time {
            text-align: left;
        }

        .typing-indicator {
            display: none;
            padding: 15px;
            background: white;
            border-radius: 18px;
            max-width: 70%;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-left: 52px;
        }

        .typing-dots {
            display: flex;
            gap: 4px;
        }

        .typing-dot {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-dot:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes typing {

            0%,
            80%,
            100% {
                transform: scale(0.8);
                opacity: 0.5;
            }

            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .chat-input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
        }

        .chat-input-form {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .input-group {
            flex: 1;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .chat-input {
            width: 100%;
            padding: 15px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 16px;
            resize: none;
            font-family: inherit;
            transition: border-color 0.3s ease;
            min-height: 50px;
            max-height: 120px;
        }

        .chat-input:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            min-width: 100px;
            margin-bottom: 0.75%;
        }

        .send-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .send-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .chat-controls {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            justify-content: center;
        }

        .control-btn {
            background: #6c757d;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s ease;
        }

        .control-btn:hover {
            background: #5a6268;
        }

        .control-btn.primary {
            background: #28a745;
        }

        .control-btn.primary:hover {
            background: #218838;
        }

        .control-btn.danger {
            background: #dc3545;
        }

        .control-btn.danger:hover {
            background: #c82333;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #666;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
        }

        .status-dot.offline {
            background: #dc3545;
        }

        .status-dot.connecting {
            background: #ffc107;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        @media (max-width: 768px) {
            .chat-container {
                margin: 10px;
            }

            .message-content {
                max-width: 85%;
            }

            .chat-input-form {
                flex-direction: column;
                align-items: stretch;
            }

            .send-btn {
                align-self: flex-end;
            }
        }

        ol,
        ul {
            padding: 0.5rem 1rem;
        }

        li {
            padding: 0.25rem 0.5rem;
        }
    </style>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
</head>

<body>
    <div class="header">
        <h1 data-i18n="app.title">Box Catering Chatbot</h1>
        <div class="nav-links" id="nav"></div>
        <div class="user-info">
            <div class="user-avatar" id="user-avatar">U</div>
            <span id="username">User</span>
            <button class="logout-btn" onclick="logout()" data-i18n="auth.logout">Logout</button>
        </div>
    </div>

    <div class="chat-container" style="display:grid; grid-template-columns: 1fr 320px; gap: 0;">
        <div class="chat-header">
            <h2 data-i18n="chatTest.headerTitle">💬 Test chat with Marichka</h2>
            <p data-i18n="chatTest.headerSubtitle">Test and interact with your AI-powered chatbot</p>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                <div class="message-avatar">👩</div>
                <div class="message-content">
                    <div id="bot-welcome-content" data-i18n="chatTest.welcome.loading">Loading welcome message…</div>
                    <div class="message-time" id="bot-welcome-time"></div>
                </div>
            </div>
        </div>

        <div class="typing-indicator" id="typing-indicator">
            <div class="typing-dots">
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
                <div class="typing-dot"></div>
            </div>
        </div>

        <div class="chat-input-container">
            <form class="chat-input-form" id="chat-form">
                <div class="input-group">
                    <label for="chat-input" data-i18n="chatTest.input.label">Enter a message:</label>
                    <textarea id="chat-input" class="chat-input" placeholder="" rows="1"></textarea>
                </div>
                <button type="submit" class="send-btn" id="send-btn" data-i18n="chatTest.send">Send</button>
            </form>

            <div class="chat-controls">
                <button class="control-btn primary" onclick="clearChat()" data-i18n="chatTest.controls.clear">Clear
                    chat</button>
                <button class="control-btn" onclick="exportChat()" data-i18n="chatTest.controls.export">Export
                    chat</button>
            </div>

            <div class="status-indicator" style="margin-top: 15px; justify-content: center">
                <div class="status-dot" id="status-dot"></div>
                <span id="status-text" data-i18n="chatTest.status.connectedToAI">Connected to AI service</span>
            </div>
        </div>
        <div id="configs-sidebar" style="border-left:1px solid #e9ecef; padding:16px; display:none;">
            <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                <strong>Configs</strong>
                <button id="new-config-btn" class="control-btn" style="padding:6px 10px;">+ New</button>
            </div>
            <div id="configs-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        </div>
    </div>

    <script src="/static/auth.js"></script>
    <script src="/static/i18n.js"></script>
    <script>
        (function () {
            async function initI18N() {
                try {
                    const token = localStorage.getItem("access_token");
                    const meRes = await fetch("/users/me", { headers: token ? { Authorization: `Bearer ${token}` } : {} });
                    const storedLang = localStorage.getItem("ui_language");
                    let lang = storedLang || "uk";
                    if (!storedLang && meRes && meRes.ok) {
                        const me = await meRes.json();
                        lang = me.preferred_language || lang;
                    }
                    if (window.I18N && I18N.setLanguage) {
                        await I18N.setLanguage(lang);
                    }
                    try {
                        const input = document.getElementById("chat-input");
                        if (input && window.I18N && I18N.t) {
                            input.placeholder = I18N.t("chatTest.input.placeholder");
                        }
                    } catch { }
                    document.querySelectorAll("[data-i18n]").forEach(function (el) {
                        const k = el.getAttribute("data-i18n");
                        if (window.I18N && I18N.t) {
                            el.textContent = I18N.t(k);
                        }
                    });
                } catch { }
            }
            window.__i18nReady = initI18N();
        })();
    </script>
    <script src="/static/nav.js"></script>
    <script>
        // Initialize chat
        let chatHistory = [];
        let isTyping = false;
        let ws = null;
        let reconnectTimer = null;
        const RECONNECT_DELAY_MS = 1500;

        // Session management
        function getOrCreateSessionId() {
            const key = "chat_session_id";
            let id = localStorage.getItem(key);
            if (!id) {
                id = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
                localStorage.setItem(key, id);
            }
            return id;
        }
        let sessionId = getOrCreateSessionId();

        // Set initial message time
        document.getElementById("bot-welcome-time").textContent = new Date().toLocaleTimeString();

        // Check authentication
        function checkAuth() {
            const token = localStorage.getItem("access_token");
            if (!token) {
                window.location.href = "/login";
                return;
            }
            fetchUserInfo();
        }

        // Fetch user information
        async function fetchUserInfo() {
            try {
                const token = localStorage.getItem("access_token");
                const response = await fetch("/users/me", {
                    headers: {
                        Authorization: `Bearer ${token}`,
                    },
                });

                if (response.ok) {
                    const user = await response.json();
                    document.getElementById("username").textContent = user.full_name || user.username;
                    document.getElementById("user-avatar").textContent = (user.full_name || user.username).charAt(0).toUpperCase();
                    // After auth, load active chatbot welcome message
                    await fetchActiveChatbotConfig();
                }
            } catch (error) {
                console.error("Error fetching user info:", error);
            }
        }

        // Fetch active chatbot configuration and show welcome message
        async function fetchActiveChatbotConfig() {
            try {
                const token = localStorage.getItem("access_token");
                const resp = await fetch("/chatbot-config/active", {
                    headers: { Authorization: `Bearer ${token}` },
                });
                if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
                const cfg = await resp.json();
                const welcome = cfg.welcome_message || cfg.handover_message || (window.I18N && I18N.t ? I18N.t("chatTest.welcome.default") : "Welcome! How can I help?");
                const node = document.getElementById("bot-welcome-content");
                if (node) node.textContent = welcome;
                document.getElementById("bot-welcome-time").textContent = new Date().toLocaleTimeString();
            } catch (e) {
                console.warn("Failed to load active chatbot config:", e);
                const node = document.getElementById("bot-welcome-content");
                if (node) node.textContent = window.I18N && I18N.t ? I18N.t("chatTest.welcome.default") : "Welcome! How can I help?";
                document.getElementById("bot-welcome-time").textContent = new Date().toLocaleTimeString();
            }
        }

        // Add message to chat
        function addMessage(content, isUser = false, timestamp = null) {
            const messagesContainer = document.getElementById("chat-messages");
            const messageDiv = document.createElement("div");
            messageDiv.className = `message ${isUser ? "user" : "bot"}`;

            const avatar = isUser ? "👤" : "👩";
            const time = timestamp || new Date().toLocaleTimeString();

            messageDiv.innerHTML = `
                <div class="message-avatar">${avatar}</div>
                <div class="message-content">
                    <div>${marked.parse(content)}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;

            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            // Store in chat history
            chatHistory.push({
                content,
                isUser,
                timestamp: time,
            });
        }

        // Show typing indicator
        function showTypingIndicator() {
            const indicator = document.getElementById("typing-indicator");
            indicator.style.display = "block";
            document.getElementById("chat-messages").scrollTop = document.getElementById("chat-messages").scrollHeight;
        }

        // Hide typing indicator
        function hideTypingIndicator() {
            document.getElementById("typing-indicator").style.display = "none";
        }

        // WebSocket helpers
        function setStatus(status, cssClass) {
            const dot = document.getElementById("status-dot");
            const text = document.getElementById("status-text");
            dot.classList.remove("offline", "connecting");
            if (cssClass) dot.classList.add(cssClass);
            try {
                if (window.I18N && I18N.t) {
                    text.textContent = I18N.t(status) || status;
                } else {
                    text.textContent = status;
                }
            } catch {
                text.textContent = status;
            }
        }

        function connectWebSocket() {
            if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) return;

            const protocol = location.protocol === "https:" ? "wss" : "ws";
            const url = `${protocol}://${location.host}/chat/ws${location.search || ""}`;
            setStatus("chatTest.status.connectingToAI", "connecting");

            ws = new WebSocket(url);

            ws.onopen = () => {
                setStatus("chatTest.status.connectedToAI", "");
                if (reconnectTimer) {
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                }
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    hideTypingIndicator();
                    const text = data && typeof data.response === "string" ? data.response.trim() : "";
                    if (text) {
                        addMessage(text);
                    } else {
                        addMessage(window.I18N && I18N.t ? I18N.t("chatTest.error.generic") : "Sorry, something went wrong. Please try again later.");
                    }

                    if (data.handover_to_manager) {
                        showHandoverNotice(data);
                    }

                    // Optional debug logging when enabled via ?debug=1
                    if (data.debug) {
                        console.log("AI Debug:", data.debug);
                    }
                } catch (err) {
                    console.error("Failed to parse message:", err);
                }
            };

            ws.onerror = () => {
                setStatus("chatTest.status.connectionError", "connecting");
            };

            ws.onclose = () => {
                setStatus("chatTest.status.disconnected", "offline");
                reconnectTimer = setTimeout(connectWebSocket, RECONNECT_DELAY_MS);
            };
        }

        function sendToWebSocket(payload) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                connectWebSocket();
                // Small delay to allow connection, then retry once
                setTimeout(() => {
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send(JSON.stringify(payload));
                    } else {
                        hideTypingIndicator();
                        addMessage(window.I18N && I18N.t ? I18N.t("chatTest.error.connectFail") : "Connection failed. Please try again later.");
                    }
                }, 500);
                return;
            }
            ws.send(JSON.stringify(payload));
        }

        function showHandoverNotice(data) {
            const reason = data.handover_reason || "HANDOVER";
            const desc = data.handover_reason_description || "";
            try {
                const notice = window.I18N && I18N.t ? I18N.t("chatTest.handover.notice", { reason: reason, desc: desc }).trim() : `Handing over to manager (${reason}). ${desc}`.trim();
                addMessage(notice);
            } catch {
                addMessage(`Handing over to manager (${reason}). ${desc}`.trim());
            }
        }

        // Handle form submission
        document.getElementById("chat-form").addEventListener("submit", function (e) {
            e.preventDefault();

            const input = document.getElementById("chat-input");
            const message = input.value.trim();

            if (!message) return;

            // Add user message
            addMessage(message, true);

            // Clear input
            input.value = "";
            input.style.height = "auto";

            // Build payload per backend schema (avoid 'Z' for Python fromisoformat)
            const timestamp = new Date().toISOString().replace("Z", "+00:00");
            const payload = {
                session_id: sessionId,
                sender: "user",
                message: message,
                timestamp: timestamp,
            };

            // Show typing while awaiting response
            showTypingIndicator();
            sendToWebSocket(payload);
        });

        // Auto-resize textarea
        document.getElementById("chat-input").addEventListener("input", function () {
            this.style.height = "auto";
            this.style.height = Math.min(this.scrollHeight, 120) + "px";
        });

        // Control functions
        function clearChat() {
            if (confirm(window.I18N && I18N.t ? I18N.t("chatTest.clear.confirm") : "Are you sure you want to clear the chat history?")) {
                const messagesContainer = document.getElementById("chat-messages");
                messagesContainer.innerHTML = `
                    <div class="message bot">
                        <div class="message-avatar">👩</div>
                        <div class="message-content">
                            <div>${window.I18N && I18N.t ? I18N.t("chatTest.cleared.message") : "Chat history cleared. How can I help you?"}</div>
                            <div class="message-time">${new Date().toLocaleTimeString()}</div>
                        </div>
                    </div>
                `;
                chatHistory = [];
                // Start a new conversation session (new UUID)
                try {
                    const newId = crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`;
                    localStorage.setItem("chat_session_id", newId);
                    sessionId = newId;
                } catch (e) {
                    sessionId = `${Date.now()}-${Math.random().toString(16).slice(2)}`;
                    localStorage.setItem("chat_session_id", sessionId);
                }
                // Reconnect to ensure a fresh state
                try {
                    if (ws) ws.close();
                } catch (e) { }
                connectWebSocket();
            }
        }

        function exportChat() {
            const userLabel = window.I18N && I18N.t ? I18N.t("chatTest.export.user") : "User";
            const botLabel = window.I18N && I18N.t ? I18N.t("chatTest.export.bot") : "Bot";
            const chatText = chatHistory.map((msg) => `[${msg.timestamp}] ${msg.isUser ? userLabel : botLabel}: ${msg.content}`).join("\n\n");

            const blob = new Blob([chatText], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `chatbot-test-${new Date().toISOString().split("T")[0]}.txt`;
            a.click();
            URL.revokeObjectURL(url);
        }

        // Logout function
        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "/login";
        }

        // Initialize on page load
        document.addEventListener("DOMContentLoaded", () => {
            checkAuth();
            connectWebSocket();
            try { loadConfigsSidebar(); } catch { }
        });

        async function loadConfigsSidebar() {
            try {
                const token = localStorage.getItem("access_token");
                const meRes = await fetch("/users/me", { headers: { Authorization: `Bearer ${token}` } });
                if (!meRes.ok) return;
                const me = await meRes.json();
                if (!me || (me.role !== 'admin' && me.role !== 'system_admin')) return;
                const wrap = document.getElementById('configs-sidebar');
                if (wrap) wrap.style.display = 'block';
                const list = document.getElementById('configs-list');
                const resp = await fetch('/chatbot-config/?limit=50', { headers: { Authorization: `Bearer ${token}` } });
                if (!resp.ok) return;
                const configs = await resp.json();
                list.innerHTML = '';
                for (const c of configs) {
                    const item = document.createElement('div');
                    item.style.border = '1px solid #e1e5e9';
                    item.style.borderRadius = '8px';
                    item.style.padding = '8px';
                    item.style.background = c.is_active ? '#f0fff4' : '#fff';
                    item.innerHTML = `
                            <div style="font-weight:600; font-size:14px; margin-bottom:6px;">${c.name}${c.is_active ? ' (active)' : ''}</div>
                            <div style="display:flex; gap:6px; flex-wrap:wrap;">
                                <button class="control-btn" data-act="test" data-id="${c.id}">Test</button>
                                <button class="control-btn" data-act="activate" data-id="${c.id}">Activate</button>
                                <button class="control-btn" data-act="clone" data-id="${c.id}">Clone</button>
                                <button class="control-btn danger" data-act="delete" data-id="${c.id}">Delete</button>
                            </div>
                        `;
                    list.appendChild(item);
                }
                list.addEventListener('click', async (e) => {
                    const btn = e.target.closest('button[data-act]');
                    if (!btn) return;
                    const id = btn.getAttribute('data-id');
                    const act = btn.getAttribute('data-act');
                    if (act === 'test') {
                        const token = localStorage.getItem('access_token');
                        const url = new URL(window.location.href);
                        url.searchParams.set('config_id', String(id));
                        url.searchParams.set('token', token);
                        window.history.replaceState({}, '', url.toString());
                        try { if (ws) ws.close(); } catch { }
                        connectWebSocket();
                    } else if (act === 'activate') {
                        await fetch(`/chatbot-config/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify({ is_active: true }) });
                        await loadConfigsSidebar();
                    } else if (act === 'clone') {
                        await fetch(`/chatbot-config/${id}/clone`, { method: 'POST', headers: { Authorization: `Bearer ${token}` } });
                        await loadConfigsSidebar();
                    } else if (act === 'delete') {
                        if (!confirm('Delete this config?')) return;
                        await fetch(`/chatbot-config/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } });
                        await loadConfigsSidebar();
                    }
                });
                const newBtn = document.getElementById('new-config-btn');
                if (newBtn) newBtn.onclick = async () => {
                    const payload = { name: 'New Config', welcome_message: 'Hello!', business_context: 'Box Catering', language: 'uk', force_language: true, is_active: false };
                    await fetch('/chatbot-config/new', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` }, body: JSON.stringify(payload) });
                    await loadConfigsSidebar();
                };
            } catch { }
        }
    </script>
