<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Catering Chatbot - Change Password</title>
    <style>
      body {
        min-height: 100vh;
      }

      .logo {
        font-size: 24px;
        font-weight: bold;
        color: #2563eb;
      }

      .main-content {
        max-width: 600px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .card {
        background: white;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        padding: 40px;
      }

      .card h1 {
        text-align: center;
        margin-bottom: 30px;
        color: #1e293b;
        font-size: 28px;
      }

      .form-group {
        margin-bottom: 24px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        color: #374151;
      }

      .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 2px solid #e5e7eb;
        border-radius: 8px;
        font-size: 16px;
        transition: border-color 0.3s ease;
      }

      .form-group input:focus {
        outline: none;
        border-color: #2563eb;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
      }

      .btn {
        width: 100%;
        padding: 14px 24px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .btn:hover {
        background: #1d4ed8;
        transform: translateY(-1px);
      }

      .btn:disabled {
        background: #9ca3af;
        cursor: not-allowed;
        transform: none;
      }

      .alert {
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
      }

      .alert-success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }

      .alert-error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fecaca;
      }

      .back-link {
        display: inline-block;
        margin-top: 20px;
        color: #2563eb;
        text-decoration: none;
        font-weight: 500;
      }

      .back-link:hover {
        text-decoration: underline;
      }

      .password-requirements {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 24px;
      }

      .password-requirements h3 {
        margin-bottom: 12px;
        color: #374151;
        font-size: 16px;
      }

      .password-requirements ul {
        margin-left: 20px;
        color: #6b7280;
      }

      .password-requirements li {
        margin-bottom: 4px;
      }
    </style>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>

  <body>
    <div class="header">
      <h1 data-i18n="app.title">Box Catering Chatbot</h1>
      <div class="nav-links" id="nav"></div>
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">U</div>
        <span id="username">User</span>
        <button class="logout-btn" onclick="logout()" data-i18n="auth.logout">
          Logout
        </button>
      </div>
    </div>

    <div class="main-content">
      <div class="card">
        <h1 data-i18n="changePassword.title">🔐 Change Password</h1>

        <div id="alert" class="alert"></div>

        <div class="password-requirements">
          <h3 data-i18n="changePassword.passwordRequirementsTitle">
            Password Requirements:
          </h3>
          <ul>
            <li data-i18n="changePassword.requirements.minLength">
              At least 8 characters long
            </li>
            <li data-i18n="changePassword.requirements.uppercase">
              Contains at least one uppercase letter
            </li>
            <li data-i18n="changePassword.requirements.lowercase">
              Contains at least one lowercase letter
            </li>
            <li data-i18n="changePassword.requirements.number">
              Contains at least one number
            </li>
            <li data-i18n="changePassword.requirements.specialChar">
              Contains at least one special character
            </li>
          </ul>
        </div>

        <form id="passwordForm">
          <div class="form-group">
            <label
              for="currentPassword"
              data-i18n="changePassword.form.currentPassword"
              >Current Password</label
            >
            <input
              type="password"
              id="currentPassword"
              name="currentPassword"
              required
            />
          </div>

          <div class="form-group">
            <label for="newPassword" data-i18n="changePassword.form.newPassword"
              >New Password</label
            >
            <input
              type="password"
              id="newPassword"
              name="newPassword"
              required
            />
          </div>

          <div class="form-group">
            <label
              for="confirmPassword"
              data-i18n="changePassword.form.confirmPassword"
              >Confirm New Password</label
            >
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              required
            />
          </div>

          <button
            type="submit"
            class="btn"
            id="submitBtn"
            data-i18n="changePassword.submit"
          >
            Change Password
          </button>
        </form>

        <a
          href="/dashboard"
          class="back-link"
          data-i18n="changePassword.backToDashboard"
          >← Back to Dashboard</a
        >
      </div>
    </div>

    <script src="/static/i18n.js"></script>
    <script src="/static/nav.js"></script>
    <script src="/static/auth.js"></script>
    <script>
      // Check authentication on page load
      document.addEventListener("DOMContentLoaded", function () {
        checkAuth();
      });

      function checkAuth() {
        const token = localStorage.getItem("access_token");
        if (!token) {
          window.location.href = "/login";
          return;
        }

        fetchUserInfo();

        // Simple token validation - just check if token exists and has valid format
        // We'll skip the /users/me call for now since it's causing 422 errors
        try {
          // Basic JWT token format validation
          const tokenParts = token.split(".");
          if (tokenParts.length !== 3) {
            throw new Error("Invalid token format");
          }

          // Decode the payload part to check expiration
          const payload = JSON.parse(atob(tokenParts[1]));
          const currentTime = Math.floor(Date.now() / 1000);

          if (payload.exp && payload.exp < currentTime) {
            throw new Error("Token expired");
          }

          console.log("Token validation successful");
        } catch (error) {
          console.error("Token validation failed:", error);
          localStorage.removeItem("access_token");
          window.location.href = "/login";
        }
      }

      // Fetch user information
      async function fetchUserInfo() {
        try {
          const token = localStorage.getItem("access_token");
          const response = await fetch("/users/me", {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          if (response.ok) {
            const user = await response.json();
            document.getElementById("username").textContent =
              user.full_name || user.username;
            document.getElementById("user-avatar").textContent = (
              user.full_name || user.username
            )
              .charAt(0)
              .toUpperCase();
          }
        } catch (error) {
          console.error("Error fetching user info:", error);
        }
      }

      function showAlert(message, type) {
        const alert = document.getElementById("alert");
        alert.textContent = message;
        alert.className = `alert alert-${type}`;
        alert.style.display = "block";

        // Auto-hide after 5 seconds
        setTimeout(() => {
          alert.style.display = "none";
        }, 5000);
      }

      function validatePassword(password) {
        const minLength = 8;
        const hasUpperCase = /[A-Z]/.test(password);
        const hasLowerCase = /[a-z]/.test(password);
        const hasNumbers = /\d/.test(password);
        const hasSpecialChar = /[!@#$%^&*(),.?":{}|<>]/.test(password);

        return (
          password.length >= minLength &&
          hasUpperCase &&
          hasLowerCase &&
          hasNumbers &&
          hasSpecialChar
        );
      }

      function validateForm() {
        const currentPassword =
          document.getElementById("currentPassword").value;
        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (!currentPassword || !newPassword || !confirmPassword) {
          showAlert(
            window.I18N && I18N.t
              ? I18N.t("changePassword.alert.allFieldsRequired")
              : "All fields are required",
            "error",
          );
          return false;
        }

        if (newPassword !== confirmPassword) {
          showAlert(
            window.I18N && I18N.t
              ? I18N.t("changePassword.alert.passwordsDontMatch")
              : "New passwords do not match",
            "error",
          );
          return false;
        }

        if (!validatePassword(newPassword)) {
          showAlert(
            window.I18N && I18N.t
              ? I18N.t("changePassword.alert.doesNotMeetRequirements")
              : "New password does not meet requirements",
            "error",
          );
          return false;
        }

        if (currentPassword === newPassword) {
          showAlert(
            window.I18N && I18N.t
              ? I18N.t("changePassword.alert.mustBeDifferent")
              : "New password must be different from current password",
            "error",
          );
          return false;
        }

        return true;
      }

      document
        .getElementById("passwordForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          if (!validateForm()) {
            return;
          }

          const submitBtn = document.getElementById("submitBtn");
          submitBtn.disabled = true;
          submitBtn.textContent =
            window.I18N && I18N.t
              ? I18N.t("changePassword.btn.loading")
              : "Changing Password...";

          const token = localStorage.getItem("access_token");
          const passwordData = {
            current_password: document.getElementById("currentPassword").value,
            new_password: document.getElementById("newPassword").value,
          };

          fetch("/users/me/change-password", {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify(passwordData),
          })
            .then((response) => {
              if (!response.ok) {
                return response.json().then((data) => {
                  throw new Error(data.detail || "Failed to change password");
                });
              }
              return response.json();
            })
            .then((data) => {
              showAlert(
                window.I18N && I18N.t
                  ? I18N.t("changePassword.alert.success")
                  : "Password changed successfully!",
                "success",
              );
              document.getElementById("passwordForm").reset();
            })
            .catch((error) => {
              const msg =
                error && error.message
                  ? error.message
                  : window.I18N && I18N.t
                    ? I18N.t("changePassword.alert.failed")
                    : "Failed to change password";
              showAlert(msg, "error");
            })
            .finally(() => {
              submitBtn.disabled = false;
              submitBtn.textContent =
                window.I18N && I18N.t
                  ? I18N.t("changePassword.submit")
                  : "Change Password";
            });
        });

      function logout() {
        localStorage.removeItem("access_token");
        window.location.href = "/login";
      }
    </script>
  </body>
</html>
