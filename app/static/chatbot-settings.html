<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Box Catering Chatbot - Configuration</title>
    <style>
      body {
        min-height: 100vh;
      }

      .container {
        max-width: 1200px;
        margin: 40px auto;
        padding: 0 20px;
      }

      .settings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
        gap: 30px;
      }

      /* Special layout only for one row */
      .special-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-template-rows: 1fr 1fr;
        gap: 30px;
        grid-template-areas:
          "large small1"
          "large small2";

        /* Make sure this row spans the whole parent grid width */
        grid-column: 1 / -1;
      }

      .large-card {
        grid-area: large;
      }

      .small-card-1 {
        grid-area: small1;
      }

      .small-card-2 {
        grid-area: small2;
      }

      .settings-card {
        background: white;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
      }

      .settings-card h3 {
        color: #333;
        margin-bottom: 20px;
        font-size: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .settings-card h3 .icon {
        font-size: 24px;
      }

      /* Compact variant to reduce vertical space (approx half height) */
      .settings-card.compact {
        padding: 16px;
      }

      .settings-card.compact h3 {
        margin-bottom: 12px;
        font-size: 18px;
      }

      .settings-card.compact .form-group {
        margin-bottom: 14px;
      }

      .settings-card.compact .toggle-group {
        padding: 8px 0;
      }

      .form-group {
        margin-bottom: 25px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #555;
        font-weight: 600;
        font-size: 14px;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e1e5e9;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.3s ease;
        background: #f8f9fa;
      }

      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        outline: none;
        border-color: #667eea;
        background: white;
      }

      .form-group textarea {
        resize: vertical;
        min-height: 100px;
      }

      .form-group .help-text {
        font-size: 12px;
        color: #666;
        margin-top: 5px;
        font-style: italic;
      }

      .toggle-group {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 15px 0;
        border-bottom: 1px solid #e9ecef;
      }

      .toggle-group:last-child {
        border-bottom: none;
      }

      .toggle-label {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }

      .toggle-label .title {
        font-weight: 600;
        color: #333;
      }

      .toggle-label .description {
        font-size: 13px;
        color: #666;
      }

      .toggle-switch {
        position: relative;
        display: inline-block;
        width: 50px;
        height: 24px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #ccc;
        transition: 0.4s;
        border-radius: 24px;
      }

      .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: 0.4s;
        border-radius: 50%;
      }

      input:checked + .slider {
        background-color: #667eea;
      }

      input:checked + .slider:before {
        transform: translateX(26px);
      }

      .range-group {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      .range-slider {
        flex: 1;
        height: 6px;
        border-radius: 3px;
        background: #e1e5e9;
        outline: none;
        appearance: none;
        -webkit-appearance: none;
      }

      .range-slider::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #667eea;
        cursor: pointer;
      }

      .range-slider::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #667eea;
        cursor: pointer;
        border: none;
      }

      .range-value {
        min-width: 50px;
        text-align: center;
        font-weight: 600;
        color: #667eea;
      }

      .action-buttons {
        display: flex;
        gap: 15px;
        justify-content: center;
        margin-top: 40px;
      }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #666;
        margin-top: 20px;
        justify-content: center;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #28a745;
      }

      .status-dot.offline {
        background: #dc3545;
      }

      .status-dot.connecting {
        background: #ffc107;
        animation: pulse 1.5s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }

        50% {
          opacity: 0.5;
        }
      }

      .alert {
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
      }

      .alert-success {
        background: #d4edda;
        color: #155724;
        border: 1px solid #c3e6cb;
      }

      .alert-error {
        background: #f8d7da;
        color: #721c24;
        border: 1px solid #f5c6cb;
      }

      .alert-warning {
        background: #fff3cd;
        color: #856404;
        border: 1px solid #ffeaa7;
      }

      @media (max-width: 768px) {
        .settings-grid {
          grid-template-columns: 1fr;
        }

        .special-row {
          grid-template-columns: 1fr;
          grid-template-rows: auto;
          grid-template-areas:
            "large"
            "small1"
            "small2";
        }

        .action-buttons {
          flex-direction: column;
          align-items: stretch;
        }

        .range-group {
          flex-direction: column;
          align-items: stretch;
          gap: 10px;
        }
      }
    </style>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>

  <body>
    <div class="header">
      <h1 data-i18n="app.title">Box Catering Chatbot</h1>
      <div class="nav-links" id="nav"></div>
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">U</div>
        <span id="username">User</span>
        <button class="logout-btn" onclick="logout()" data-i18n="auth.logout">
          Logout
        </button>
      </div>
    </div>

    <div class="container">
      <div
        id="configs-sidebar"
        style="margin-bottom: 20px; display: flex; gap: 10px; flex-wrap: wrap"
      ></div>
      <div class="page-header">
        <h2 data-i18n="chatbotSettings.headerTitle">
          ⚙️ Chatbot Configuration
        </h2>
        <p data-i18n="chatbotSettings.headerSubtitle">
          Customize your AI-powered chatbot settings, behavior, and responses to
          match your business needs
        </p>
        <div class="form-group" style="margin-top: 20px">
          <label
            for="chatbot-name"
            data-i18n="chatbotSettings.labels.chatbotName"
            >Chatbot Name</label
          >
          <input
            type="text"
            id="chatbot-name"
            value="Marichka"
            placeholder="Marichka"
            data-i18n-placeholder="chatbotSettings.placeholders.chatbotName"
          />
          <div
            class="help-text"
            data-i18n="chatbotSettings.labels.chatbotNameHelp"
          >
            Shown in widgets and test header
          </div>
        </div>
        <div class="form-group" style="margin-top: 20px">
          <label
            for="main-agent"
            >MAIN</label
          >
          <textarea id="main-agent" placeholder="MAIN"></textarea>
          <label
            for="assortment-agent"
            >ASSORTMENT</label
          >
          <textarea id="assortment-agent" placeholder="ASSORTMENT"></textarea>
          <label
            for="delivery-agent"
            >DELIVERY</label
          >
          <textarea id="delivery-agent" placeholder="VALIDATION"></textarea>
          <label
            for="validation-agent"
            >VALIDATION</label
          >
          <textarea id="validation-agent" placeholder="VALIDATION"></textarea>
        </div>
        <div class="form-group" style="margin-top: 20px">
          <label
            for="greeting-message"
            data-i18n="chatbotSettings.labels.welcome"
            >Welcome Message</label
          >
          <textarea
            id="greeting-message"
            placeholder="Custom greeting message..."
            data-i18n-placeholder="chatbotSettings.placeholders.welcome"
          ></textarea>
        </div>
      </div>

      <div id="alert-container"></div>

      <div class="action-buttons">
        <button
          class="btn btn-primary"
          onclick="saveSettings()"
          data-i18n="chatbotSettings.btn.save"
        >
          💾 Save Settings
        </button>
        <button
          class="btn btn-secondary"
          onclick="resetToDefaults()"
          data-i18n="chatbotSettings.btn.reset"
        >
          🔄 Reset to Defaults
        </button>
        <button
          class="btn btn-success"
          onclick="testConfiguration()"
          data-i18n="chatbotSettings.btn.test"
        >
          🧪 Test Configuration
        </button>
      </div>

      <div class="status-indicator" style="margin-top: 30px">
        <div class="status-dot" id="status-dot"></div>
        <span id="status-text" data-i18n="chatbotSettings.status.saved"
          >Configuration saved successfully</span
        >
      </div>
    </div>

    <script src="/static/auth.js"></script>
    <script src="/static/i18n.js"></script>
    <script>
      (function () {
        async function initI18N() {
          try {
            const token = localStorage.getItem("access_token");
            const meRes = await fetch("/users/me", {
              headers: { Authorization: `Bearer ${token}` },
            });
            const storedLang = localStorage.getItem("ui_language");
            let lang = storedLang || "uk";

            if (!storedLang && meRes.ok) {
              const me = await meRes.json();
              lang = me.preferred_language || lang;
            }

            if (window.I18N && I18N.setLanguage) {
              await I18N.setLanguage(lang);
            }

            document.querySelectorAll("[data-i18n]").forEach((el) => {
              const k = el.getAttribute("data-i18n");
              const dict = window.I18N && I18N._dict;
              const txt = dict && dict[k] ? dict[k] : null;
              if (txt) el.textContent = txt;
            });

            document
              .querySelectorAll("[data-i18n-placeholder]")
              .forEach((el) => {
                const k = el.getAttribute("data-i18n-placeholder");
                const dict = window.I18N && I18N._dict;
                const txt = dict && dict[k] ? dict[k] : null;
                if (txt) el.setAttribute("placeholder", txt);
              });
          } catch {}
        }

        window.__i18nReady = initI18N();
      })();
    </script>
    <script src="/static/nav.js"></script>
    <script>
      const getToken = () => localStorage.getItem("access_token") || "";
      const byId = (id) => document.getElementById(id);

      let currentSettings = {};
      let pendingContextFiles = [];
      let __currentUserRole = null;
      let __currentConfigId = null;

      const defaultSettings = {
        systemInstruction: "",
        greetingMessage: "",
      };

      function checkAuth() {
        const token = getToken();
        if (!token) {
          window.location.href = "/login";
          return;
        }
        fetchUserInfo();
      }

      async function fetchUserInfo() {
        try {
          const response = await fetch("/users/me", {
            headers: {
              Authorization: `Bearer ${getToken()}`,
            },
          });

          if (!response.ok) return;

          const user = await response.json();
          __currentUserRole = user.role || null;

          const name = user.full_name || user.username || "User";
          const usernameEl = byId("username");
          const avatarEl = byId("user-avatar");

          if (usernameEl) usernameEl.textContent = name;
          if (avatarEl) avatarEl.textContent = name.charAt(0).toUpperCase();

          if (__currentUserRole === "manager") {
            showAccessDeniedMessage();
            return;
          }

          try {
            setupContextUploader();
          } catch {}

          if (__currentUserRole === "system_admin") {
            try {
              listContextFiles();
            } catch {}
          }

          loadSettings();
        } catch (error) {
          console.error("Error fetching user info:", error);
        }
      }

      async function loadSettings() {
        try {
          const url = new URL(window.location.href);
          const qpConfigId = url.searchParams.get("config_id");
          __currentConfigId = qpConfigId ? parseInt(qpConfigId) : null;

          const endpoint = __currentConfigId
            ? `/chatbot-config/${__currentConfigId}`
            : "/chatbot-config/active";

          const response = await fetch(endpoint, {
            headers: {
              Authorization: `Bearer ${getToken()}`,
            },
          });

          if (!response.ok) {
            setDefaults();
            return;
          }

          const dbSettings = await response.json();

          currentSettings = {
            ...defaultSettings,
            chatbotName: dbSettings.chatbot_name || "Marichka",
            greetingMessage:
              dbSettings.welcome_message || defaultSettings.greetingMessage,
            system_instruction:
              dbSettings.system_instruction || defaultSettings.systemInstruction,
          };
        } catch (error) {
          console.error("Error loading settings from database:", error);
          setDefaults();
          return;
        }

        if (__currentUserRole === "system_admin") {
          await loadSystemSettings();
        } else {
          try {
            setReadOnlyForSystemCards();
          } catch {}
        }

        applySettings();
      }

      async function loadSystemSettings() {
        try {
          const sysResp = await fetch("/system-config/settings/all", {
            headers: {
              Authorization: `Bearer ${getToken()}`,
            },
          });

          if (!sysResp.ok) return;

          const sysSettings = await sysResp.json();
          const system = sysSettings.system || {};

          if (system.scrape_enabled !== undefined) {
            currentSettings.scrapeEnabled =
              system.scrape_enabled === true ||
              system.scrape_enabled === "True";
          }

          if (system.context_docs_enabled !== undefined) {
            currentSettings.contextDocsEnabled =
              system.context_docs_enabled === true ||
              system.context_docs_enabled === "True";
          }

          if (system.context_docs_dir) {
            currentSettings.contextDocsDir = system.context_docs_dir;
          }

          if (system.context_docs_max_chars) {
            const n = parseInt(system.context_docs_max_chars);
            if (!isNaN(n)) currentSettings.contextDocsMaxChars = n;
          }

          if (system.scrape_website_url) {
            currentSettings.scrapeWebsiteUrl = system.scrape_website_url;
          }

          if (system.scrape_interval_minutes) {
            const m = parseInt(system.scrape_interval_minutes);
            if (!isNaN(m)) currentSettings.scrapeIntervalMinutes = m;
          }

          try {
            const override = localStorage.getItem("context_docs_enabled");
            if (override !== null) {
              currentSettings.contextDocsEnabled = override === "true";
            }
          } catch {}
        } catch (e) {
          console.warn("Could not load system settings:", e);
        }
      }

      function setDefaults() {
        currentSettings = { ...defaultSettings };
        applySettings();
      }

      function applySettings() {
        const botNameEl = byId("chatbot-name");
        const greetingEl = byId("greeting-message");
        const system = JSON.parse(currentSettings.system_instruction)

        const mainAgent = byId("main-agent")
        const assortmentAgent = byId("assortment-agent")
        const deliveryAgent = byId("delivery-agent")
        const validationAgent = byId("validation-agent")

        if (botNameEl)
          botNameEl.value = currentSettings.chatbotName || "Marichka";
        if (greetingEl)
          greetingEl.value = currentSettings.greetingMessage || "";
        if (mainAgent)
          mainAgent.value = system.main || "";
        if (assortmentAgent)
          assortmentAgent.value = system.assortment || "";
        if (deliveryAgent)
          deliveryAgent.value = system.delivery || "";
        if (validationAgent)
          validationAgent.value = system.validation || "";
      }

      function readFormValues() {
        const chatbotName = (byId("chatbot-name")?.value || "").trim();
        const greetingMessage = (byId("greeting-message")?.value || "").trim();
        const system_instruction = {
          main: (
            byId("main-agent")?.value || ""
          ).trim(),
          assortment: (
            byId("assortment-agent")?.value || ""
          ).trim(),
          delivery: (
            byId("delivery-agent")?.value || ""
          ).trim(),
          validation: (
            byId("validation-agent")?.value || ""
          ).trim()
        };

        return { chatbotName, greetingMessage, system_instruction };
      }

      async function saveSettings() {
        try {
          const { chatbotName, greetingMessage, system_instruction } =
            readFormValues();
          console.log(system_instruction)
          const settings = {
            name: "Box Catering Chatbot Configuration",
            chatbot_name: chatbotName || "Marichka",
            welcome_message: greetingMessage,
            system_instruction: JSON.stringify(system_instruction),
          };

          const isEditingSpecificConfig = !!__currentConfigId;

          if (!isEditingSpecificConfig) {
            settings.is_active = true;
          } else {
            delete settings.name;
          }

          const endpoint = isEditingSpecificConfig
            ? `/chatbot-config/${__currentConfigId}`
            : "/chatbot-config/";
          const method = isEditingSpecificConfig ? "PUT" : "POST";

          const response = await fetch(endpoint, {
            method,
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${getToken()}`,
            },
            body: JSON.stringify(settings),
          });

          if (response.ok) {
            currentSettings = {
              chatbotName: chatbotName || "Marichka",
              greetingMessage: greetingMessage || "",
              system_instruction,
            };

            showAlert("Settings saved successfully to database!", "success");
            updateStatus("Configuration saved successfully", "success");
            return;
          }

          const errorData = await safeJson(response);
          const errorMessage = buildErrorMessage(
            "Failed to save settings",
            errorData,
          );

          showAlert(errorMessage, "error");
          updateStatus("Failed to save configuration", "error");
        } catch (error) {
          console.error("Error saving settings:", error);
          const message = error && error.detail ? formatDetail(error.detail) : "Unknown error occurred";

          showAlert(`Failed to save settings: ${message}`, "error");
          updateStatus("Error saving configuration", "error");
        }
      }

      function formatDetail(detail) {
        if (Array.isArray(detail)) {
          return detail.map((err) => err.msg || err.message || err).join(", ");
        }
        if (typeof detail === "string") return detail;
        try {
          return JSON.stringify(detail);
        } catch {
          return "Unknown error";
        }
      }

      function buildErrorMessage(prefix, errorData) {
        if (!errorData || !errorData.detail) return prefix;
        let msg = prefix;

        if (Array.isArray(errorData.detail)) {
          msg +=
            ": " +
            errorData.detail
              .map((e) => e.msg || e.message || "Unknown error")
              .join(", ");
        } else {
          msg += ": " + errorData.detail;
        }

        return msg;
      }

      async function safeJson(response) {
        try {
          return await response.json();
        } catch {
          return null;
        }
      }

      async function createNewConfig() {
        try {
          const payload = await buildPayloadFromForm(false);
          const resp = await fetch("/chatbot-config/new", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${getToken()}`,
            },
            body: JSON.stringify(payload),
          });

          if (!resp.ok) throw new Error("Create failed");
          showAlert("New configuration created", "success");
        } catch (e) {
          console.warn(e);
          showAlert("Failed to create configuration", "error");
        }
      }

      async function cloneConfig(configId) {
        try {
          const resp = await fetch(`/chatbot-config/${configId}/clone`, {
            method: "POST",
            headers: { Authorization: `Bearer ${getToken()}` },
          });
          if (!resp.ok) throw new Error("Clone failed");
          const data = await resp.json();
          showAlert("Configuration cloned", "success");
          openTestPanelForConfig(data.id);
        } catch (e) {
          console.warn(e);
          showAlert("Failed to clone configuration", "error");
        }
      }

      function openTestPanelForConfig(configId) {
        try {
          const token = getToken();
          const origin = window.location.origin.replace("http", "ws");
          const url = new URL(origin + "/chat/ws");
          url.searchParams.set("config_id", String(configId));
          url.searchParams.set("debug", "1");
          const ws = new WebSocket(url);
          ws.addEventListener("open", () => {
            updateStatus(
              "Connected to test chat (config " + configId + ")",
              "connected",
            );
          });
        } catch (e) {
          console.warn("Failed to open test panel WS:", e);
        }
      }

      async function listContextFiles() {
        try {
          const resp = await fetch("/context-docs/list", {
            headers: { Authorization: `Bearer ${getToken()}` },
          });
          if (!resp.ok) throw new Error("Failed to list context files");
          const data = await resp.json();
          renderContextFiles(data.files || []);
        } catch (e) {
          console.warn("List files failed", e);
          renderContextFiles([]);
        }
      }

      function renderContextFiles(files) {
        const container = byId("context-files-list");
        if (!container) return;

        container.innerHTML = "";

        if (!files.length) {
          const div = document.createElement("div");
          div.style.padding = "10px";
          div.style.fontSize = "14px";
          div.style.color = "#666";
          div.textContent = "No files loaded";
          container.appendChild(div);
          return;
        }

        files.forEach((f) => {
          const row = document.createElement("div");
          row.style.display = "flex";
          row.style.alignItems = "center";
          row.style.justifyContent = "space-between";
          row.style.padding = "10px 12px";
          row.style.borderBottom = "1px solid #f0f2f5";

          const left = document.createElement("div");
          left.style.display = "flex";
          left.style.alignItems = "center";
          left.style.gap = "10px";

          const icon = document.createElement("span");
          icon.textContent = "📄";

          const name = document.createElement("span");
          name.textContent = f.name;
          name.style.fontWeight = "600";

          const small = document.createElement("span");
          small.style.color = "#888";
          small.style.fontSize = "12px";
          small.textContent = ` ${Math.ceil((f.size || 0) / 1024)} KB`;

          left.append(icon, name, small);

          const del = document.createElement("button");
          del.className = "btn-sm btn-danger";
          del.textContent =
            window.I18N && I18N.t
              ? I18N.t("chatbotSettings.ctx.delete")
              : "Delete";

          del.onclick = async () => {
            if (!confirm(`Delete ${f.name}?`)) return;
            try {
              const resp = await fetch(
                `/context-docs/${encodeURIComponent(f.name)}`,
                {
                  method: "DELETE",
                  headers: { Authorization: `Bearer ${getToken()}` },
                },
              );
              if (!resp.ok) throw new Error("Delete failed");
              showAlert("File deleted", "success");
              await listContextFiles();
            } catch (e) {
              showAlert("Failed to delete file", "error");
              console.warn(e);
            }
          };

          row.append(left, del);
          container.appendChild(row);
        });
      }

      function setupContextUploader() {
        if (__currentUserRole !== "system_admin") return;

        const area = byId("context-upload-area");
        const input = byId("context-file-input");
        const uploadBtn = byId("upload-context-files");
        const refreshBtn = byId("refresh-context-files");
        const selectedContainer = byId("context-selected-files");

        if (!area || !input || !uploadBtn || !refreshBtn || !selectedContainer)
          return;

        const highlight = () => {
          area.style.borderColor = "#667eea";
          area.style.background = "#f0f2ff";
        };
        const unhighlight = () => {
          area.style.borderColor = "#e1e5e9";
          area.style.background = "#fafbfc";
        };

        area.addEventListener("click", () => input.click());
        area.addEventListener("dragover", (e) => {
          e.preventDefault();
          highlight();
        });
        area.addEventListener("dragleave", (e) => {
          e.preventDefault();
          unhighlight();
        });
        area.addEventListener("drop", (e) => {
          e.preventDefault();
          unhighlight();
          if (e.dataTransfer && e.dataTransfer.files) {
            input.files = e.dataTransfer.files;
            renderSelectedFiles(input.files);
            showAlert(`${input.files.length} file(s) selected`, "success");
          }
        });

        input.addEventListener("change", () => {
          renderSelectedFiles(input.files);
          showAlert(`${input.files.length} file(s) selected`, "success");
        });

        uploadBtn.addEventListener("click", async () => {
          try {
            if (!input.files || input.files.length === 0) {
              showAlert("No files selected", "error");
              return;
            }

            const fd = new FormData();
            Array.from(input.files).forEach((f) => fd.append("files", f));

            const resp = await fetch("/context-docs/upload", {
              method: "POST",
              headers: { Authorization: `Bearer ${getToken()}` },
              body: fd,
            });

            if (!resp.ok) throw new Error("Upload failed");

            const data = await resp.json();
            const saved = data.saved || [];
            const skipped = data.skipped || [];

            if (saved.length)
              showAlert(`Uploaded: ${saved.join(", ")}`, "success");
            if (skipped.length)
              showAlert(
                `Skipped: ${skipped.map((s) => s.name).join(", ")}`,
                "warning",
              );

            input.value = "";
            renderSelectedFiles([]);
            await listContextFiles();
          } catch (e) {
            console.warn(e);
            showAlert("Failed to upload files", "error");
          }
        });

        refreshBtn.addEventListener("click", listContextFiles);

        function renderSelectedFiles(fileList) {
          selectedContainer.innerHTML = "";
          const files = Array.from(fileList || []);
          if (!files.length) {
            const empty = document.createElement("div");
            empty.style.padding = "8px";
            empty.style.fontSize = "13px";
            empty.style.color = "#666";
            empty.textContent = "No files selected";
            selectedContainer.appendChild(empty);
            return;
          }

          files.forEach((f) => {
            const row = document.createElement("div");
            row.style.display = "flex";
            row.style.alignItems = "center";
            row.style.justifyContent = "space-between";
            row.style.padding = "8px 10px";
            row.style.borderBottom = "1px solid #f0f2f5";

            const left = document.createElement("div");
            left.style.display = "flex";
            left.style.alignItems = "center";
            left.style.gap = "10px";

            const icon = document.createElement("span");
            icon.textContent = "📎";

            const name = document.createElement("span");
            name.textContent = f.name;
            name.style.fontWeight = "600";

            const size = document.createElement("span");
            size.style.color = "#888";
            size.style.fontSize = "12px";
            size.textContent = ` ${Math.ceil((f.size || 0) / 1024)} KB`;

            left.append(icon, name, size);
            row.appendChild(left);
            selectedContainer.appendChild(row);
          });
        }
      }

      function setupContextDocsTogglePersistence() {
        const el = byId("context-docs-enabled");
        if (!el) return;

        try {
          const stored = localStorage.getItem("context_docs_enabled");
          if (stored !== null) {
            el.checked = stored === "true";
          }
        } catch {}

        el.addEventListener("change", async function () {
          const v = !!this.checked;
          try {
            localStorage.setItem("context_docs_enabled", String(v));
          } catch {}

          try {
            await fetch("/system-config/settings/system", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${getToken()}`,
              },
              body: JSON.stringify({ context_docs_enabled: v }),
            });
          } catch (e) {
            console.warn("Failed to persist context_docs_enabled", e);
          }
        });

        document.addEventListener("i18n:languageChanged", () => {
          try {
            const stored = localStorage.getItem("context_docs_enabled");
            if (stored !== null) {
              el.checked = stored === "true";
            }
          } catch {}
        });
      }

      function setReadOnlyForSystemCards() {
        const makeReadOnly = (card) => {
          if (!card) return;

          const note = document.createElement("div");
          note.className = "alert alert-warning";
          note.style.display = "block";
          note.setAttribute("data-i18n", "chatbotSettings.readOnlyNotice");
          note.textContent =
            window.I18N && I18N.t
              ? I18N.t("chatbotSettings.readOnlyNotice")
              : "View only. System Administrator required to edit.";
          card.prepend(note);

          card
            .querySelectorAll("input, select, textarea, button")
            .forEach((el) => {
              el.disabled = true;
            });
        };

        try {
          makeReadOnly(document.querySelector(".settings-card.large-card"));
          makeReadOnly(document.querySelector(".settings-card.small-card-2"));
        } catch {}
      }

      function resetToDefaults() {
        if (
          confirm(
            "Are you sure you want to reset all settings to default values? This action cannot be undone.",
          )
        ) {
          setDefaults();
          showAlert("Settings reset to defaults!", "success");
          updateStatus("Settings reset to defaults", "success");
        }
      }

      function testConfiguration() {
        showAlert(
          "Testing configuration... This may take a few moments.",
          "warning",
        );
        updateStatus("Testing configuration...", "connecting");

        setTimeout(() => {
          showAlert(
            "Configuration test completed successfully! All settings are valid.",
            "success",
          );
          updateStatus("Configuration test completed successfully", "success");
        }, 2000);
      }

      function showAlert(message, type) {
        const alertContainer = byId("alert-container");
        if (!alertContainer) return;

        const alertDiv = document.createElement("div");
        alertDiv.className = `alert alert-${type}`;
        alertDiv.textContent = message;

        alertContainer.appendChild(alertDiv);
        alertDiv.style.display = "block";

        setTimeout(() => {
          alertDiv.remove();
        }, 5000);
      }

      function updateStatus(message, type) {
        const statusText = byId("status-text");
        const statusDot = byId("status-dot");

        if (statusText) statusText.textContent = message;
        if (statusDot) statusDot.className = `status-dot ${type}`;
      }

      const temperatureEl = byId("temperature");
      if (temperatureEl) {
        temperatureEl.addEventListener("input", function () {
          const temperatureValueEl = byId("temperature-value");
          if (temperatureValueEl) {
            temperatureValueEl.textContent = this.value;
          }
        });
      }

      const maxTokensEl = byId("max-tokens");
      if (maxTokensEl) {
        maxTokensEl.addEventListener("input", function () {
          const maxTokensValueEl = byId("max-tokens-value");
          if (maxTokensValueEl) {
            maxTokensValueEl.textContent = this.value;
          }
        });
      }

      const responseTimeoutEl = byId("response-timeout");
      if (responseTimeoutEl) {
        responseTimeoutEl.addEventListener("input", function () {
          const responseTimeoutValueEl = byId("response-timeout-value");
          if (responseTimeoutValueEl) {
            responseTimeoutValueEl.textContent = this.value;
          }
        });
      }

      function showAccessDeniedMessage() {
        const container = document.querySelector(".container");
        if (!container) return;

        container.innerHTML = `
          <div class="page-header">
            <h2>🚫 Access Denied</h2>
            <p>You do not have permission to access this page. Only administrators and system administrators can access General Settings.</p>
          </div>
          <div style="text-align: center; margin-top: 40px;">
            <button class="btn btn-primary" onclick="window.location.href='/dashboard'">
              🏠 Return to Dashboard
            </button>
          </div>
        `;
      }

      function logout() {
        localStorage.removeItem("access_token");
        window.location.href = "/login";
      }

      document.addEventListener("DOMContentLoaded", async () => {
        checkAuth();
        setupContextDocsTogglePersistence();
        try {
          await renderConfigsSidebar();
        } catch (e) {
          console.warn("Configs sidebar failed:", e);
        }
      });
    </script>
  </body>
</html>
