<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="assortment.title">Assortment</title>
    <style>
        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            padding: 20px;
        }

        .card-header {
            font-weight: 600;
            color: #333;
            margin-bottom: 12px;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-header h3 {
            color: #333;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #eee;
            text-align: left;
        }

        th {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
        }

        tr:hover {
            background: #fafbff;
        }

        .muted {
            color: #666;
        }

        .upload-row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .upload-row input[type="file"] {
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #e0e0e0;
            background: white;
        }
    </style>
    <link rel="stylesheet" href="/static/styles.css">
    <script src="/static/auth.js"></script>
    <script src="/static/i18n.js"></script>
    <script src="/static/nav.js"></script>
</head>

<body>
    <div class="header">
        <h1 data-i18n="app.title">Box Catering Chatbot</h1>
        <div class="nav-links" id="nav"></div>
        <div class="user-info">
            <div class="user-avatar" id="user-avatar">U</div>
            <span id="username" data-i18n="user.label">User</span>
            <button class="logout-btn" onclick="logout()" data-i18n="auth.logout">Logout</button>
        </div>
    </div>

    <div class="container">
        <div class="page-header">
            <h2 data-i18n="assortment.heading">Assortment</h2>
            <p data-i18n="assortment.subtitle">Manage products offered to customers. Upload from Excel.</p>
        </div>

        <div class="card" style="margin-bottom: 20px;">
            <div class="card-header" data-i18n="assortment.uploadTitle">Upload Excel</div>
            <div class="card-body">
                <form id="upload-form" class="upload-row">
                    <input type="file" id="excel-file" accept=".xlsx,.xls" />
                    <label>
                        <input type="checkbox" id="replace" checked />
                        <span data-i18n="assortment.replace">Replace existing</span>
                    </label>
                    <button type="submit" class="btn btn-primary" data-i18n="assortment.uploadBtn">Upload</button>
                </form>
                <div id="upload-result" class="muted" style="margin-top:8px;"></div>
            </div>
        </div>

        <div class="table-container">
            <div class="table-header">
                <h3><span>🧾</span><span data-i18n="assortment.tableTitle">Assortment Items</span></h3>
            </div>
            <table id="assortment-table">
                <thead>
                    <tr>
                        <th data-i18n="assortment.columns.name">Item Name</th>
                        <th data-i18n="assortment.columns.description">Description</th>
                        <th data-i18n="assortment.columns.price">Price (UAH)</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script>
        function logout() { try { localStorage.removeItem('access_token'); } catch { } window.location.href = '/login'; }

        async function fetchAssortment() {
            const token = Auth.getToken();
            const res = await fetch('/assortment/items', {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            if (!res.ok) return [];
            return await res.json();
        }

        function renderTable(items) {
            const tbody = document.querySelector('#assortment-table tbody');
            if (!tbody) return;
            tbody.innerHTML = '';
            items.forEach(function (item) {
                const tr = document.createElement('tr');
                const tdName = document.createElement('td');
                tdName.textContent = item.name || '';
                const tdDesc = document.createElement('td');
                tdDesc.textContent = item.description || '';
                const tdPrice = document.createElement('td');
                try {
                    const n = Number(item.price_uah);
                    tdPrice.textContent = isFinite(n) ? n.toFixed(2) : String(item.price_uah);
                } catch { tdPrice.textContent = String(item.price_uah || ''); }
                tr.appendChild(tdName);
                tr.appendChild(tdDesc);
                tr.appendChild(tdPrice);
                tbody.appendChild(tr);
            });
        }

        async function handleUpload(e) {
            e.preventDefault();
            const input = document.getElementById('excel-file');
            const replace = document.getElementById('replace').checked;
            const out = document.getElementById('upload-result');
            if (!input || !input.files || !input.files[0]) return;
            const token = Auth.getToken();
            const form = new FormData();
            form.append('file', input.files[0]);
            form.append('replace', String(replace));
            out.textContent = (window.I18N && I18N.t) ? I18N.t('assortment.uploading') : 'Uploading...';
            try {
                const res = await fetch('/assortment/upload', {
                    method: 'POST',
                    headers: { 'Authorization': `Bearer ${token}` },
                    body: form
                });
                if (!res.ok) {
                    const txt = await res.text();
                    out.textContent = (window.I18N && I18N.t) ? I18N.t('assortment.uploadError') : 'Upload failed';
                    console.error(txt);
                } else {
                    const data = await res.json();
                    out.textContent = ((window.I18N && I18N.t) ? I18N.t('assortment.uploadOk') : 'Upload OK') +
                        `: ${data.imported}/${data.total_rows}`;
                    const items = await fetchAssortment();
                    renderTable(items);
                }
            } catch (err) {
                out.textContent = (window.I18N && I18N.t) ? I18N.t('assortment.uploadError') : 'Upload failed';
            }
        }

        (function init() {
            // Initialize i18n like other pages
            (async function initI18N() {
                try {
                    const token = localStorage.getItem('access_token');
                    const meRes = await fetch('/users/me', { headers: { 'Authorization': `Bearer ${token}` } });
                    const storedLang = localStorage.getItem('ui_language');
                    let lang = storedLang || 'uk';
                    if (!storedLang && meRes && meRes.ok) {
                        const me = await meRes.json();
                        lang = me.preferred_language || lang;
                    }
                    if (window.I18N && I18N.setLanguage) {
                        await I18N.setLanguage(lang);
                    }
                    document.querySelectorAll('[data-i18n]').forEach(function (el) {
                        const k = el.getAttribute('data-i18n');
                        if (window.I18N && I18N.t) { el.textContent = I18N.t(k); }
                    });
                } catch { }
            })();

            const form = document.getElementById('upload-form');
            if (form) form.addEventListener('submit', handleUpload);
            fetchAssortment().then(renderTable).catch(function () { });
        })();
    </script>
</body>

</html>
