<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Box Catering Chatbot - Order History</title>
    <style>
        body {
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .filters-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .filters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            align-items: end;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .filter-group label {
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .filter-group input,
        .filter-group select {
            padding: 10px 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.3s ease;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-actions {
            display: flex;
            gap: 15px;
            align-items: flex-end;
        }

        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            text-align: center;
            transition: transform 0.2s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-number {
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table-container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            overflow-x: auto;
        }

        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .table-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .table-actions {
            display: flex;
            gap: 15px;
        }

        .orders-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        .orders-table th {
            background: #f8f9fa;
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            color: #555;
            border-bottom: 2px solid #e9ecef;
            white-space: nowrap;
        }

        .orders-table td {
            padding: 15px 12px;
            border-bottom: 1px solid #e9ecef;
            vertical-align: middle;
        }

        .orders-table tbody tr:hover {
            background: #f8f9fa;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-pending {
            background: #fff3cd;
            color: #856404;
        }

        .status-confirmed {
            background: #d1ecf1;
            color: #0c5460;
        }

        .status-preparing {
            background: #d4edda;
            color: #155724;
        }

        .status-delivered {
            background: #c3e6cb;
            color: #155724;
        }

        .status-cancelled {
            background: #f8d7da;
            color: #721c24;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .action-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 30px;
        }

        .pagination button {
            padding: 8px 12px;
            border: 1px solid #e1e5e9;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pagination button:hover {
            background: #667eea;
            color: white;
        }

        .pagination button.active {
            background: #667eea;
            color: white;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .no-orders {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .no-orders h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
        }

        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 700px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close:hover {
            color: #333;
        }

        .modal-body {
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .modal-footer {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .filters-grid {
                grid-template-columns: 1fr;
            }

            .filter-actions {
                flex-direction: column;
                align-items: stretch;
            }

            .stats-summary {
                grid-template-columns: repeat(2, 1fr);
            }

            .table-header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }

            .table-actions {
                align-items: center;
            }

            .orders-table {
                font-size: 12px;
            }

            .orders-table th,
            .orders-table td {
                padding: 10px 8px;
            }

            .action-buttons {
                flex-direction: column;
            }
        }
    </style>
    <link rel="stylesheet" href="/static/styles.css">
</head>

<body>

        <div class="user-info">

        </div>

    <div class="container">

        <div id="alert-container"></div>

        <!-- Statistics Summary -->

                <div class="stat-number" id="total-orders">0</div>
                <div class="stat-label" data-i18n="orderHistory.stats.totalOrders">Total Orders</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="pending-orders">0</div>
                <div class="stat-label" data-i18n="orderHistory.stats.pending">Pending</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="active-orders">0</div>
                <div class="stat-label" data-i18n="orderHistory.stats.active">Active</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="completed-orders">0</div>
                <div class="stat-label" data-i18n="orderHistory.stats.completed">Completed</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="total-revenue">₴0</div>
                <div class="stat-label" data-i18n="orderHistory.stats.totalRevenue">Total Revenue</div>
            </div>
        </div>

        <!-- Filters Section -->
        <div class="filters-section">
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="status-filter" data-i18n="orderHistory.filters.status">Status</label>
                    <select id="status-filter">
                        <option value="" data-i18n="orderHistory.filters.allStatuses">All Statuses</option>
                        <option value="pending" data-i18n="orderHistory.status.pending">Pending</option>
                        <option value="confirmed" data-i18n="orderHistory.status.confirmed">Confirmed</option>
                        <option value="preparing" data-i18n="orderHistory.status.preparing">Preparing</option>
                        <option value="delivered" data-i18n="orderHistory.status.delivered">Delivered</option>
                        <option value="cancelled" data-i18n="orderHistory.status.cancelled">Cancelled</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="date-from" data-i18n="orderHistory.filters.dateFrom">Date From</label>
                    <input type="date" id="date-from">
                </div>
                <div class="filter-group">
                    <label for="date-to" data-i18n="orderHistory.filters.dateTo">Date To</label>
                    <input type="date" id="date-to">
                </div>
            </div>
            <div class="filters-grid">
                <div class="filter-group">
                    <label for="search-input" data-i18n="orderHistory.filters.search">Search</label>
                    <input type="text" id="search-input" placeholder="Customer name, order ID..."
                        data-i18n-placeholder="orderHistory.filters.searchPh">
                </div>
                <div class="filter-actions">
                    <button class="btn btn-primary" onclick="applyFilters()">
                        <span aria-hidden="true">🔍</span>
                        <span data-i18n="orderHistory.filters.apply">Apply</span>
                    </button>
                    <button class="btn btn-secondary" onclick="clearFilters()">
                        <span aria-hidden="true">🔄</span>
                        <span data-i18n="orderHistory.filters.clear">Clear</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Orders Table -->
        <div class="table-container">
            <div class="table-header">
                <div class="table-title" data-i18n="orderHistory.table.title">Order Details</div>
                <div class="table-actions">
                    <button class="btn btn-secondary" onclick="reloadOrders()">
                        <span aria-hidden="true">🔄</span>
                        <span data-i18n="orderHistory.table.refresh">Refresh</span>
                    </button>
                </div>
            </div>

            <div id="table-content">
                <div class="loading">
                    <div class="spinner"></div>
                    <p data-i18n="orderHistory.loading">Loading orders...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Order Details Modal -->
    <div id="orderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title" id="modalTitle">Order Details</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body" id="modalBody">
                <!-- Modal content will be populated dynamically -->
            </div>
            <div class="modal-footer" id="modalFooter">
                <!-- Modal buttons will be populated dynamically -->
            </div>
        </div>
    </div>

    <!-- New Order Modal -->
    <div id="newOrderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 class="modal-title">Create New Order</h3>
                <span class="close" onclick="closeModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="newOrderForm">
                    <div class="form-group">
                        <label for="customer-name">Customer Name *</label>
                        <input type="text" id="customer-name" required>
                    </div>
                    <div class="form-group">
                        <label for="customer-phone">Customer Phone *</label>
                        <input type="tel" id="customer-phone" required>
                    </div>
                    <div class="form-group">
                        <label for="customer-email">Customer Email</label>
                        <input type="email" id="customer-email">
                    </div>
                    <div class="form-group">
                        <label for="delivery-date">Delivery Date *</label>
                        <input type="date" id="delivery-date" required>
                    </div>
                    <div class="form-group">
                        <label for="delivery-time">Delivery Time *</label>
                        <input type="time" id="delivery-time" required>
                    </div>
                    <div class="form-group">
                        <label for="customer-address">Customer Address *</label>
                        <textarea id="customer-address" required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="menu-items">Menu Items *</label>
                        <textarea id="menu-items" placeholder="List the menu items for this order..."
                            required></textarea>
                    </div>
                    <div class="form-group">
                        <label for="guests-count">Number of Guests</label>
                        <input type="number" id="guests-count" min="1">
                    </div>
                    <div class="form-group">
                        <label for="special-requirements">Special Requirements</label>
                        <textarea id="special-requirements"
                            placeholder="Dietary restrictions, allergies, special requests..."></textarea>
                    </div>
                    <div class="form-group">
                        <label for="order-notes">Notes</label>
                        <textarea id="order-notes" placeholder="Additional notes for the order..."></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createOrder()">Create Order</button>
            </div>
        </div>
    </div>

    <script src="/static/nav.js"></script>
    <script>
        (function () {
            async function initI18N() {
                try {
                    const token = localStorage.getItem('access_token');
                    const meRes = await fetch('/users/me', { headers: { 'Authorization': `Bearer ${token}` } });
                    const storedLang = localStorage.getItem('ui_language');
                    let lang = storedLang || 'uk';
                    if (!storedLang && meRes.ok) {
                        const me = await meRes.json();
                        lang = me.preferred_language || lang;
                    }
                    if (window.I18N && I18N.setLanguage) {
                        await I18N.setLanguage(lang);
                    }
                    document.querySelectorAll('[data-i18n]').forEach(function (el) {
                        const k = el.getAttribute('data-i18n');
                        if (window.I18N && I18N.t) { el.textContent = I18N.t(k); }
                    });
                    document.querySelectorAll('[data-i18n-placeholder]').forEach(function (el) {
                        const k = el.getAttribute('data-i18n-placeholder');
                        if (window.I18N && I18N.t) { el.setAttribute('placeholder', I18N.t(k)); }
                    });
                    if (typeof renderOrdersTable === 'function') { renderOrdersTable(); }
                } catch { }
            }
            window.__i18nReady = initI18N();
        })();
    </script>
    <script>
        // Global variables
        let orders = [];
        let filteredOrders = [];
        let currentPage = 1;
        const ordersPerPage = 10;
        const t = (k) => (window.I18N && I18N.t) ? I18N.t(k) : k;
        let __currentUserRole = null;

        // Check authentication
        function checkAuth() {
            const token = localStorage.getItem('access_token');
            if (!token) {
                window.location.href = '/login';
                return;
            }
            fetchUserInfo();
            loadOrders();
        }

        // Fetch user information
        async function fetchUserInfo() {
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch('/users/me', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    const user = await response.json();
                    __currentUserRole = user.role || null;
                    document.getElementById('username').textContent = user.full_name || user.username;
                    document.getElementById('user-avatar').textContent = (user.full_name || user.username).charAt(0).toUpperCase();
                }
            } catch (error) {
                console.error('Error fetching user info:', error);
            }
        }

        // Load orders
        async function loadOrders() {
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch('/orders/', {
                    headers: {
                        'Authorization': `Bearer ${token}`
                    }
                });

                if (response.ok) {
                    orders = await response.json();

                    orders.forEach((order) => {
                        order.customer_name = order.customer.name || "";
                        order.customer_email = order.customer.email || "";
                        order.customer_phone = order.customer.phone || "";
                        order.delivery_address = order.customer.address || "";
                        order.status = this.mapStateToStatus(order.state);
                    });

                    filteredOrders = [...orders];
                    updateStats();
                    renderOrdersTable();
                } else {
                    // For demo purposes, create sample orders if API fails
                    createSampleOrders();
                }
            } catch (error) {
                console.error('Error loading orders:', error);
                createSampleOrders();
            }
        }

        // Update statistics
        function updateStats() {
            const total = orders.length;
            const pending = orders.filter(o => o.status === 'pending').length;
            const active = orders.filter(o => ['confirmed', 'preparing'].includes(o.status)).length;
            const completed = orders.filter(o => o.status === 'delivered').length;
            const revenue = orders.reduce((sum, o) => {
                const amount = typeof o.total_amount === 'number' ? o.total_amount : parseFloat(o.total_amount || '0');
                return sum + (isNaN(amount) ? 0 : amount);
            }, 0);

            document.getElementById('total-orders').textContent = total;
            document.getElementById('pending-orders').textContent = pending;
            document.getElementById('active-orders').textContent = active;
            document.getElementById('completed-orders').textContent = completed;
            document.getElementById('total-revenue').textContent = `₴${revenue.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
        }

        // Apply filters
        function applyFilters() {
            const statusFilter = document.getElementById('status-filter').value;
            const dateFrom = document.getElementById('date-from').value;
            const dateTo = document.getElementById('date-to').value;
            const searchTerm = document.getElementById('search-input').value.toLowerCase();

            filteredOrders = orders.filter(order => {
                // Status filter
                if (statusFilter && order.status !== statusFilter) return false;

                // Date range filter
                if (dateFrom && order.delivery_date < dateFrom) return false;
                if (dateTo && order.delivery_date > dateTo) return false;

                // Search filter
                if (searchTerm) {
                    const searchableText = `${order.customer_name} ${order.customer_email} ${order.id}`.toLowerCase();
                    if (!searchableText.includes(searchTerm)) return false;
                }

                return true;
            });

            currentPage = 1;
            renderOrdersTable();
        }

        // Clear filters
        function clearFilters() {
            document.getElementById('status-filter').value = '';
            document.getElementById('date-from').value = '';
            document.getElementById('date-to').value = '';
            document.getElementById('search-input').value = '';

            filteredOrders = [...orders];
            currentPage = 1;
            renderOrdersTable();
        }

        // Render orders table
        function renderOrdersTable() {
            const tableContent = document.getElementById('table-content');

            if (filteredOrders.length === 0) {
                tableContent.innerHTML = `
                    <div class="no-orders">
                        <h3>${t('orderHistory.empty.title')}</h3>
                        <p>${t('orderHistory.empty.subtitle')}</p>
                    </div>
                `;
                return;
            }

            const startIndex = (currentPage - 1) * ordersPerPage;
            const endIndex = startIndex + ordersPerPage;
            const pageOrders = filteredOrders.slice(startIndex, endIndex);

            let tableHTML = `
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>${t('orderHistory.table.orderId')}</th>
                            <th>${t('orderHistory.table.customer')}</th>
                            <th>${t('orderHistory.table.deliveryDate')}</th>
                            <th>${t('orderHistory.table.guests')}</th>
                            <th>${t('orderHistory.table.status')}</th>
                            <th>${t('orderHistory.table.createdAt')}</th>
                            <th>${t('orderHistory.table.total')}</th>
                            <th>${t('orderHistory.table.actions')}</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            pageOrders.forEach(order => {
                const statusClass = `status-${order.status}`;
                const deliveryDate = new Date(order.delivery_date).toLocaleDateString();
                const createdDate = new Date(order.created_at).toLocaleDateString();
                const totalFormatted = `₴${(order.total_amount || 0).toLocaleString()}`;

                tableHTML += `
                    <tr>
                        <td><strong>#${order.id}</strong></td>
                        <td>
                            <div><strong>${order.customer_name}</strong></div>
                            <div style="font-size: 12px; color: #666;">${order.customer_email}</div>
                        </td>
                        <td>${deliveryDate}</td>
                        <td>${order.guests_count || 0}</td>
                        <td><span class="status-badge ${statusClass}">${t('orderHistory.status.' + order.status)}</span></td>
                        <td>${createdDate}</td>
                        <td><strong>${totalFormatted}</strong></td>
                        <td>
                            <div class="action-buttons">
                                <button class="action-btn btn-primary" onclick="viewOrder(${order.id})">👁️ ${t('orderHistory.actions.view')}</button>
                                <button class="action-btn btn-success" onclick="updateStatus(${order.id})">🔄 ${t('orderHistory.actions.status')}</button>
                                ${order.conversation_id ? `<button class="action-btn btn-secondary" onclick="navigateToConversation(${order.conversation_id})">💬 ${t('orderHistory.actions.viewChat') || 'View Chat'}</button>` : ''}
                                ${order.customer_id ? `<button class="action-btn" onclick="navigateToCustomer(${order.customer_id})">👤 ${t('orderHistory.actions.viewCustomer') || 'Customer'}</button>` : ''}
                            </div>
                        </td>
                    </tr>
                `;
            });

            tableHTML += `
                    </tbody>
                </table>
            `;

            // Add pagination
            const totalPages = Math.ceil(filteredOrders.length / ordersPerPage);
            if (totalPages > 1) {
                tableHTML += renderPagination(totalPages);
            }

            tableContent.innerHTML = tableHTML;
        }

        // Render pagination
        function renderPagination(totalPages) {
            let paginationHTML = '<div class="pagination">';

            // Previous button
            paginationHTML += `<button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>${t('orderHistory.pagination.prev')}</button>`;

            // Page numbers
            for (let i = 1; i <= totalPages; i++) {
                if (i === currentPage) {
                    paginationHTML += `<button class="active" onclick="changePage(${i})">${i}</button>`;
                } else if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
                    paginationHTML += `<button onclick="changePage(${i})">${i}</button>`;
                } else if (i === currentPage - 3 || i === currentPage + 3) {
                    paginationHTML += `<button disabled>...</button>`;
                }
            }

            // Next button
            paginationHTML += `<button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>${t('orderHistory.pagination.next')}</button>`;

            paginationHTML += '</div>';
            return paginationHTML;
        }

        // Change page
        function changePage(page) {
            const totalPages = Math.ceil(filteredOrders.length / ordersPerPage);
            if (page >= 1 && page <= totalPages) {
                currentPage = page;
                renderOrdersTable();
            }
        }

        // View order details
        function viewOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            const modalBody = document.getElementById('modalBody');
            const modalFooter = document.getElementById('modalFooter');
            const modalTitle = document.getElementById('modalTitle');

            modalTitle.textContent = `${t('orderHistory.modal.titlePrefix')} #${order.id} - ${order.customer_name}`;

            modalBody.innerHTML = `
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <h4>${t('orderHistory.modal.customerInfo')}</h4>
                        <p><strong>${t('orderHistory.modal.name')}</strong> ${order.customer_name}</p>
                        <p><strong>${t('orderHistory.modal.email')}</strong> ${order.customer_email}</p>
                        <p><strong>${t('orderHistory.modal.phone')}</strong> ${order.customer_phone || 'N/A'}</p>
                        <p><strong>${t('orderHistory.modal.deliveryDate')}</strong> ${new Date(order.delivery_date).toLocaleDateString()}</p>
                        <p><strong>${t('orderHistory.modal.deliveryTime')}</strong> ${order.delivery_time}</p>
                        <p><strong>${t('orderHistory.modal.guests')}</strong> ${order.guests_count}</p>
                    </div>
                    <div>
                        <h4>${t('orderHistory.modal.orderDetails')}</h4>
                        <p><strong>${t('orderHistory.table.status')}</strong> <span class="status-badge status-${order.status}">${t('orderHistory.status.' + order.status)}</span></p>
                        <p><strong>Created At</strong> ${new Date(order.created_at).toLocaleString()}</p>
                        <p><strong>${t('orderHistory.modal.totalAmount')}</strong> ₴${(order.total_amount || 0).toLocaleString()}</p>
                    </div>
                </div>
                <div style="margin-top: 20px;">
                    <h4>${t('orderHistory.modal.customerAddress')}</h4>
                    <p>${order.customer_address || 'N/A'}</p>
                </div>
                <div style="margin-top: 20px;">
                    <h4>${t('orderHistory.modal.menuItems')}</h4>
                    <p style="white-space: pre-line;">${order.menu_items || 'N/A'}</p>
                </div>
                <div style="margin-top: 20px;">
                    <h4>${t('orderHistory.modal.specialReq')}</h4>
                    <p>${order.special_requirements || 'None'}</p>
                </div>
                <div style="margin-top: 20px;">
                    <h4>${t('orderHistory.modal.notes')}</h4>
                    <p>${order.notes || 'No additional notes'}</p>
                </div>
            `;

            modalFooter.innerHTML = `
                <button class="btn btn-secondary" onclick="closeModal()">${t('orderHistory.modal.close')}</button>
                <button class="btn btn-success" onclick="updateStatus(${order.id})">${t('orderHistory.modal.updateStatus')}</button>
                ${order.conversation_id ? `<button class="btn btn-secondary" onclick="navigateToConversation(${order.conversation_id})">💬 ${t('orderHistory.actions.viewChat') || 'View Chat'}</button>` : ''}
                ${order.customer_id ? `<button class="btn" onclick="navigateToCustomer(${order.customer_id})">👤 ${t('orderHistory.actions.viewCustomer') || 'Customer'}</button>` : ''}
            `;

            document.getElementById('orderModal').style.display = 'block';
        }

        // Map frontend status to backend state
        function mapStatusToState(status) {
            switch (String(status || '').toLowerCase()) {
                case 'pending':
                    return 'draft';
                case 'confirmed':
                    return 'confirmed';
                case 'preparing':
                    return 'in_progress';
                case 'delivered':
                    return 'completed';
                case 'cancelled':
                    return 'cancelled';
                default:
                    return undefined;
            }
        }

        // Map backend state to frontend status
        function mapStateToStatus(state) {
            switch (String(state || '').toLowerCase()) {
                case 'draft':
                    return 'pending';
                case 'confirmed':
                    return 'confirmed';
                case 'in_progress':
                    return 'preparing';
                case 'completed':
                    return 'delivered';
                case 'cancelled':
                    return 'cancelled';
                default:
                    return undefined;
            }
        }

        async function saveEditedOrder(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            // Read values
            const updated = {
                customer_name: document.getElementById('edit-customer-name').value.trim(),
                customer_email: document.getElementById('edit-customer-email').value.trim(),
                customer_phone: document.getElementById('edit-customer-phone').value.trim(),
                customer_address: document.getElementById('edit-customer-address').value.trim(),
                delivery_date: document.getElementById('edit-delivery-date').value,
                delivery_time: document.getElementById('edit-delivery-time').value,
                guests_count: parseInt(document.getElementById('edit-guests').value || '0') || undefined,
                status: document.getElementById('edit-status').value,
                total_amount: parseFloat(document.getElementById('edit-total').value || '0') || 0,
                menu_items: document.getElementById('edit-menu-items').value,
                notes: document.getElementById('edit-notes').value,
            };

            // Update local order object
            Object.assign(order, updated);

            // Try to persist supported fields to backend
            try {
                const payload = {};
                const mappedState = mapStatusToState(updated.status);
                if (mappedState) payload.state = mappedState;
                if (!isNaN(updated.total_amount)) payload.total_amount = updated.total_amount;
                if (updated.notes !== undefined) payload.notes = updated.notes;

                // Only call API if we have something to send
                if (Object.keys(payload).length > 0) {
                    const token = localStorage.getItem('access_token');
                    const resp = await fetch(`/orders/${orderId}`, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                        },
                        body: JSON.stringify(payload)
                    });
                    if (resp.ok) {
                        const serverOrder = await resp.json();
                        // Sync state back to status
                        const serverStatus = mapStateToStatus(serverOrder.state);
                        if (serverStatus) order.status = serverStatus;
                        order.total_amount = (typeof serverOrder.total_amount === 'number' ? serverOrder.total_amount : parseFloat(serverOrder.total_amount || '0')) || order.total_amount;
                        order.notes = serverOrder.notes ?? order.notes;
                    } else {
                        console.warn('Failed to persist order update, keeping local changes.');
                    }
                }
            } catch (e) {
                console.warn('Error updating order via API:', e);
            }

            updateStats();
            renderOrdersTable();
            closeModal();
            showAlert(`Order #${order.id} updated successfully`, 'success');
        }

        // Update order status
        function updateStatus(orderId) {
            if (__currentUserRole === 'manager') {
                try {
                    const token = localStorage.getItem('access_token');
                    fetch(`/orders/${orderId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json', ...(token ? { 'Authorization': `Bearer ${token}` } : {}) },
                        body: JSON.stringify({ state: 'completed' })
                    }).catch(function () { /* ignore */ });
                } catch { }
            }
            const order = orders.find(o => o.id === orderId);
            if (!order) return;

            const statuses = ['pending', 'confirmed', 'preparing', 'delivered', 'cancelled'];
            const currentIndex = statuses.indexOf(order.status);
            const nextStatus = statuses[(currentIndex + 1) % statuses.length];

            if (__currentUserRole === 'manager') {
                order.status = 'delivered';
            } else {
                order.status = nextStatus;
            }
            updateStats();
            renderOrdersTable();
            showAlert(`Order #${order.id} status updated to ${nextStatus}`, 'success');
        }

        // Create new order
        async function createOrder() {
            const form = document.getElementById('newOrderForm');
            const formData = new FormData(form);

            // Validate required fields
            const requiredFields = ['customer-name', 'customer-phone', 'customer-address', 'delivery-date', 'delivery-time', 'menu-items'];
            for (let field of requiredFields) {
                if (!document.getElementById(field).value) {
                    showAlert(`Please fill in the ${field.replace('-', ' ')} field`, 'error');
                    return;
                }
            }

            // Prepare new order (frontend shape)
            const baseNewOrder = {
                id: (orders.length ? Math.max(...orders.map(o => o.id)) + 1 : 1),
                customer_name: document.getElementById('customer-name').value,
                customer_email: document.getElementById('customer-email').value,
                customer_phone: document.getElementById('customer-phone').value,
                delivery_date: document.getElementById('delivery-date').value,
                delivery_time: document.getElementById('delivery-time').value,
                guests_count: parseInt(document.getElementById('guests-count').value),
                customer_address: document.getElementById('customer-address').value,
                menu_items: document.getElementById('menu-items').value,
                special_requirements: document.getElementById('special-requirements').value,
                status: 'pending',
                total_amount: Math.floor(Math.random() * 2000) + 500,
                created_at: new Date().toISOString(),
                notes: document.getElementById('order-notes').value
            };

            // Try calling backend API if available; gracefully fall back to local insert
            try {
                const token = localStorage.getItem('access_token');
                const response = await fetch('/orders/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        ...(token ? { 'Authorization': `Bearer ${token}` } : {})
                    },
                    body: JSON.stringify({
                        // This payload is a placeholder; backend create endpoint may differ.
                        // We pass minimal info; backend can ignore unknowns.
                        customer_name: baseNewOrder.customer_name,
                        customer_email: baseNewOrder.customer_email,
                        customer_phone: baseNewOrder.customer_phone,
                        delivery_date: baseNewOrder.delivery_date,
                        delivery_time: baseNewOrder.delivery_time,
                        guests_count: baseNewOrder.guests_count,
                        customer_address: baseNewOrder.customer_address,
                        menu_items: baseNewOrder.menu_items,
                        special_requirements: baseNewOrder.special_requirements,
                        priority: baseNewOrder.priority, // This field was removed from form
                        notes: baseNewOrder.notes,
                        total_amount: baseNewOrder.total_amount
                    })
                });

                if (response.ok) {
                    const created = await response.json();
                    // Merge server-provided id if present
                    if (created && created.id) {
                        baseNewOrder.id = created.id;
                    }
                }
            } catch (err) {
                // Silently fall back to local insertion if API isn't ready
                console.warn('Create order API not available, using local list only.', err);
            }

            orders.unshift(baseNewOrder);
            filteredOrders = [...orders];
            updateStats();
            renderOrdersTable();

            closeModal();
            showAlert(`Order #${baseNewOrder.id} created successfully`, 'success');
        }

        // Reload orders from backend (or demo fallback)
        function reloadOrders() {
            const tableContent = document.getElementById('table-content');
            tableContent.innerHTML = `
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>${t('orderHistory.loading')}</p>
                    </div>
                `;
            // Reset to first page
            currentPage = 1;
            loadOrders();
        }

        // Close modal
        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
            document.getElementById('newOrderModal').style.display = 'none';
        }

        // Navigation helpers
        function navigateToConversation(conversationId) {
            if (!conversationId) return;
            window.location.href = `/static/conversation-history.html?conversationId=${encodeURIComponent(conversationId)}`;
        }

        function navigateToCustomer(customerId) {
            if (!customerId) return;
            window.location.href = `/static/customers.html?customerId=${encodeURIComponent(customerId)}`;
        }

        // Export orders
        function exportOrders() {
            const csvContent = generateCSV(filteredOrders);
            const blob = new Blob([csvContent], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `orders-${new Date().toISOString().split('T')[0]}.csv`;
            a.click();
            URL.revokeObjectURL(url);

            showAlert('Orders exported successfully!', 'success');
        }

        // Generate CSV content
        function generateCSV(orders) {
            const headers = ['ID', 'Customer Name', 'Email', 'Phone', 'Delivery Date', 'Delivery Time', 'Guests', 'Status', 'Created At', 'Total Amount'];
            const csvRows = [headers.join(',')];

            orders.forEach(order => {
                const row = [
                    order.id,
                    `"${order.customer_name}"`,
                    `"${order.customer_email}"`,
                    `"${order.customer_phone || ''}"`,
                    order.delivery_date,
                    order.delivery_time,
                    order.guests_count,
                    order.status,
                    new Date(order.created_at).toLocaleDateString(),
                    order.total_amount
                ];
                csvRows.push(row.join(','));
            });

            return csvRows.join('\n');
        }

        // Show alert message
        function showAlert(message, type) {
            const alertContainer = document.getElementById('alert-container');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;

            alertContainer.appendChild(alertDiv);
            alertDiv.style.display = 'block';

            setTimeout(() => {
                alertDiv.remove();
            }, 5000);
        }

        // Logout function
        function logout() {
            localStorage.removeItem('access_token');
            window.location.href = '/login';
        }

        // Close modal when clicking outside
        window.onclick = function (event) {
            const orderModal = document.getElementById('orderModal');
            const newOrderModal = document.getElementById('newOrderModal');
            if (event.target === orderModal) {
                orderModal.style.display = 'none';
            }
            if (event.target === newOrderModal) {
                newOrderModal.style.display = 'none';
            }
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function () {
            checkAuth();
            // Deep link: open order by id
            try {
                const params = new URLSearchParams(window.location.search);
                const orderId = parseInt(params.get('orderId'));
                if (!isNaN(orderId)) {
                    // Wait for orders to load then open
                    const openWhenReady = setInterval(() => {
                        if (orders && orders.length) {
                            clearInterval(openWhenReady);
                            if (orders.find(o => o.id === orderId)) {
                                viewOrder(orderId);
                            }
                        }
                    }, 200);
                    // Safety stop after 8 seconds
                    setTimeout(() => clearInterval(openWhenReady), 8000);
                }
            } catch { }
        });
    </script>
